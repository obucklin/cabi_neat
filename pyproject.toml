[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cabi_neat"
description = "Parametric cabinet design based on compas_timber."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Oliver Bucklin", email = "obucklin@ethz.ch" }]
dynamic = ["version"]
dependencies = ["compas_timber"]

[project.optional-dependencies]
occ = ["compas_brep[occ]"]
viewer = ["compas_threejs", "compas_brep[occ]"]
hops = ["easyhops"]
dev = ["pytest>=8", "ruff", "compas_brep[occ]"]

[project.scripts]
cabi-neat = "cabi_neat.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cabi_neat.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cabi_neat = ["planner_frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_occ: needs the OCC Brep backend"]

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
